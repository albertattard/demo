<!DOCTYPE html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Something Went Wrong</title>
    <meta name="robots" content="noindex">
</head>
<body>
<section layout:fragment="content" class="mx-auto max-w-5xl">
    <div class="rounded-2xl border bg-white/60 p-8 md:p-12 shadow-sm">
        <div class="flex items-start gap-4">
            <div class="text-4xl md:text-5xl">🔥🧯</div>
            <div>
                <h1 class="text-2xl md:text-3xl font-semibold tracking-tight">
                    Well, this is awkward…
                </h1>
                <p class="mt-2 text-slate-600">
                    Our server just tripped over an exception and face-planted. It’s not you, it’s <em>JSON</em>.
                </p>

                <div class="mt-6 flex flex-wrap gap-3">
                    <a href="/"
                       class="inline-flex items-center rounded-xl border px-4 py-2 text-slate-700 hover:bg-slate-50">
                        ← Home
                    </a>
                </div>

                <div class="mt-6 text-xs text-slate-400">
                    <span>Internal Server Error</span> • <span>Something exploded!</span>
                </div>

                <p class="mt-6 text-xs text-slate-400">
                    Pro tip: if this keeps happening, feed the servers coffee. ☕️
                </p>
            </div>
        </div>
    </div>
</section>
</body>
</html>
