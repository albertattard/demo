<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Not Found</title>
</head>
<body>
<section layout:fragment="content" class="mx-auto max-w-5xl">
    <div class="rounded-2xl border bg-white/60 p-8 md:p-12 shadow-sm">
        <div class="flex items-start gap-4">
            <div class="text-4xl md:text-5xl">☕️🚧</div>
            <div>
                <h1 class="text-2xl md:text-3xl font-semibold tracking-tight">We couldn’t find that page</h1>
                <p class="mt-2 text-slate-600">
                    The page you’re looking for doesn’t exist or may have moved.
                </p>
                <p class="mt-1 text-slate-500 text-sm">
                    <span th:text="${path}">/unknown-page</span>
                </p>

                <div class="mt-6 flex flex-wrap gap-3">
                    <a href="/" class="inline-flex items-center rounded-xl border px-4 py-2 text-slate-700 hover:bg-slate-50">
                        ← Home
                    </a>
                    <a href="/offers" class="inline-flex items-center rounded-xl bg-amber-600 px-4 py-2 text-white hover:bg-amber-700">
                        Browse all offers
                    </a>
                </div>

                <div class="mt-6 text-xs text-slate-400">
                    Error <span th:text="${status}">404</span> •
                    <span th:text="${error}">Not Found</span>
                    <span th:if="${message != null}"> • <span th:text="${message}">Page not found</span></span>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
