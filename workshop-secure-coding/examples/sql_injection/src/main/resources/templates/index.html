<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catalog</title>
    <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
        crossorigin="anonymous">
    </head>
    <body>
        <div class="container my-2" align="center">
            <h3>Search</h3>
            <form action="#" th:action-"@{/}" th:object="${SearchTerm}" method="POST">
                <input type="text" th:field="*{term}" placeholder="Search description for..." class="form-control mb-4">
                <button type="submit" class="btn btn-info col-2">Search</button>
            </form>
            <br/>
            <table style="width:80%" border="1" class = "table table-striped table-responsive-md">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Item</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="catalogue:${catalogueItems}">
                        <td th:text="${catalogue.guid}"></td>
                        <td th:text="${catalogue.caption}"></td>
                        <td th:text="${catalogue.description}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>
</html>
