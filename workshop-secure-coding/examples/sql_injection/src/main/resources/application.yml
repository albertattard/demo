spring:
  application:
    name: 'SQL_injection'

  datasource:
    url: jdbc:h2:mem:db
    driverClassName: org.h2.Driver
    username: sa
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none

server:
  port: 8080

logging:
  level:
    org.springframework.web: DEBUG
    demo: DEBUG
