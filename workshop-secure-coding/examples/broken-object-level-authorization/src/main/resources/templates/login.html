<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | BOLA workshop</title>
    <link rel="stylesheet" th:href="@{/css/workshop.css}">
</head>
<body class="auth-page">
<main class="auth-panel">
    <div class="eyebrow">Secure coding workshop</div>
    <h1>Sign in</h1>
    <p>Use a workshop account to inspect how object-level authorization behaves after authentication.</p>

    <p class="login-error" th:if="${param.error}">The username or password is incorrect. Try again.</p>
    <p class="login-error" th:if="${param.logout}">You have signed out.</p>

    <form class="login-form" th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="username">Username<input id="username" name="username" autocomplete="username" required autofocus></label>
        <label for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
