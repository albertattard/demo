service:
    message: "Hello, World, from µ-service b!"

server:
    port: 444
    ssl:
        key-store-type: "PKCS12"
        key-store: "service-b.p12"
        key-store-password: "service_b-password"
        key-alias: "service-b"

        trust-store: "../ca-truststore.p12"
        trust-store-password: "ca-truststore-pass"

        enabled: true

        # required if you want the framework to request/capture inbound certs
        client-auth: want    # ...or "need", which will cause Spring to authenticate it.
    http:
        port: 81