spring.application.name=Catalogue
server.port=8081

# Database (using OpenTelemetry driver)
spring.datasource.url=jdbc:otel:h2:mem:db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=io.opentelemetry.instrumentation.jdbc.OpenTelemetryDriver
spring.flyway.url=${spring.datasource.url}
spring.flyway.driver-class-name=${spring.datasource.driver-class-name}
spring.jpa.hibernate.ddl-auto=validate

# OpenTelemetry (Export only the traces)
otel.metrics.exporter=none
otel.logs.exporter=none
