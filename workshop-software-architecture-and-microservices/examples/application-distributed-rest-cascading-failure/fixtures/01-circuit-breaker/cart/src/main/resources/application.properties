spring.application.name=Cart
server.port=8082

# Readiness checks application availability without querying dependencies.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState

# Database
spring.datasource.url=jdbc:mysql://127.0.0.1:3308/cart
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=cart
spring.datasource.password=cart password
spring.datasource.hikari.maximum-pool-size=4
spring.flyway.url=${spring.datasource.url}
spring.flyway.driver-class-name=${spring.datasource.driver-class-name}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.jpa.hibernate.ddl-auto=validate

# OpenTelemetry (Export only the traces)
otel.metrics.exporter=none
otel.logs.exporter=none
otel.traces.exporter=otlp
otel.exporter.otlp.protocol=http/protobuf
otel.exporter.otlp.endpoint=http://localhost:4318

# Keep the existing HTTP read timeout as the only request timeout.
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true
# The exercise focuses on the circuit breaker, not bulkhead isolation.
spring.cloud.circuitbreaker.bulkhead.resilience4j.enabled=false
