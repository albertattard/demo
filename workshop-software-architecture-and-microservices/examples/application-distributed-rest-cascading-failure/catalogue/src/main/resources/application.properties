spring.application.name=Catalogue
server.port=8081
# Database
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/catalogue
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=catalogue
spring.datasource.password=catalogue password
spring.datasource.hikari.maximum-pool-size=4
spring.flyway.url=${spring.datasource.url}
spring.flyway.driver-class-name=${spring.datasource.driver-class-name}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.jpa.hibernate.ddl-auto=validate
# OpenTelemetry (Export only the traces)
otel.metrics.exporter=none
otel.logs.exporter=none
otel.traces.exporter=otlp
otel.exporter.otlp.protocol=http/protobuf
otel.exporter.otlp.endpoint=http://localhost:4318
